<svg width="1800" height="1200" viewBox="0 0 1800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="650" y1="505" x2="1150" y2="695" gradientUnits="userSpaceOnUse">
      <stop stop-color="#735CFF"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#20DFF2"/>
    </linearGradient>
    <linearGradient id="limeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20E7F6"/>
      <stop offset="1" stop-color="#C7F94E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#20E7F6" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#20E7F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 52px; font-weight: 850; letter-spacing: -1px; fill: #F7F3FF; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #BDB4D6; }
      .nodeTitle { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 820; fill: #F7F3FF; }
      .nodeText { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 560; fill: #CFC8E8; }
      .tiny { font-family: "JetBrains Mono", Menlo, monospace; font-size: 15px; font-weight: 650; fill: #8F86AA; letter-spacing: 1px; }
      .flow { font-family: "JetBrains Mono", Menlo, monospace; font-size: 17px; font-weight: 700; fill: #F7F3FF; letter-spacing: 0.8px; }
      .card { fill: #100D19; stroke: #2B2440; stroke-width: 2; }
      .card2 { fill: #171321; stroke: #30284A; stroke-width: 2; }
      .line { stroke: #3F365E; stroke-width: 3; fill: none; }
      .lineCyan { stroke: #20E7F6; stroke-width: 3.5; fill: none; opacity: 0.85; }
      .linePurple { stroke: #7C5CFF; stroke-width: 3.5; fill: none; opacity: 0.82; }
      .lineMuted { stroke: #60567D; stroke-width: 2.4; fill: none; opacity: 0.7; }
    </style>
  </defs>

  <rect width="1800" height="1200" rx="44" fill="#030208"/>
  <path d="M0 185C260 90 470 118 680 195C920 284 1118 273 1354 160C1534 74 1670 88 1800 142V0H0V185Z" fill="#0B0714"/>
  <path d="M0 1086C220 1005 463 990 716 1057C969 1124 1180 1122 1436 1016C1588 953 1703 960 1800 996V1200H0V1086Z" fill="#08050F"/>

  <text x="90" y="86" class="title">Mapa mental do Hirly</text>
  <text x="93" y="125" class="subtitle">Visão visual das áreas do app e como elas se conectam</text>

  <!-- center -->
  <g filter="url(#glow)">
    <rect x="720" y="505" width="360" height="190" rx="44" fill="url(#brand)"/>
    <rect x="724" y="509" width="352" height="182" rx="40" stroke="white" stroke-opacity="0.18" stroke-width="2"/>
    <text x="900" y="585" text-anchor="middle" class="title">Hirly</text>
    <text x="900" y="626" text-anchor="middle" class="subtitle" fill="#F7F3FF">carreira inicial com IA confiável</text>
    <text x="900" y="660" text-anchor="middle" class="tiny" fill="#E8E3FF">FEED • MATCH • CV • CANDIDATURA</text>
  </g>

  <!-- main connections from center -->
  <path class="linePurple" marker-end="url(#arrowPurple)" d="M720 555C590 455 466 360 330 265"/>
  <path class="lineCyan" marker-end="url(#arrowCyan)" d="M825 505C755 385 700 283 620 165"/>
  <path class="linePurple" marker-end="url(#arrowPurple)" d="M975 505C1045 385 1104 283 1190 165"/>
  <path class="lineCyan" marker-end="url(#arrowCyan)" d="M1080 555C1206 453 1335 358 1480 265"/>
  <path class="lineCyan" marker-end="url(#arrowCyan)" d="M1080 642C1214 730 1337 820 1490 938"/>
  <path class="linePurple" marker-end="url(#arrowPurple)" d="M975 695C1045 820 1102 918 1190 1035"/>
  <path class="lineCyan" marker-end="url(#arrowCyan)" d="M825 695C755 820 700 918 620 1035"/>
  <path class="linePurple" marker-end="url(#arrowPurple)" d="M720 642C589 730 459 821 310 938"/>

  <!-- Produto -->
  <g filter="url(#softShadow)">
    <rect x="95" y="164" width="470" height="220" rx="28" class="card"/>
    <text x="130" y="214" class="nodeTitle">Produto</text>
    <text x="130" y="251" class="nodeText">• App mobile para estágio, trainee e 1º emprego</text>
    <text x="130" y="282" class="nodeText">• Promessa: achar vaga boa mais rápido</text>
    <text x="130" y="313" class="nodeText">• Diferencial: feed + match + IA explicável</text>
    <text x="130" y="344" class="nodeText">• Prioridade: clareza, confiança e ação</text>
  </g>

  <!-- Usuario -->
  <g filter="url(#softShadow)">
    <rect x="525" y="60" width="410" height="220" rx="28" class="card2"/>
    <text x="560" y="110" class="nodeTitle">Usuário</text>
    <text x="560" y="147" class="nodeText">• Onboarding + CV</text>
    <text x="560" y="178" class="nodeText">• Perfil, skills e preferências</text>
    <text x="560" y="209" class="nodeText">• Feed, curtidas e aplicações</text>
    <text x="560" y="240" class="nodeText">• Tracker de candidatura</text>
  </g>

  <!-- Vagas -->
  <g filter="url(#softShadow)">
    <rect x="1040" y="60" width="450" height="230" rx="28" class="card"/>
    <text x="1075" y="110" class="nodeTitle">Vagas + Admin</text>
    <text x="1075" y="147" class="nodeText">• Vaga estruturada: empresa, cargo, salário</text>
    <text x="1075" y="178" class="nodeText">• Qualidade: fonte, link, requisitos, frescor</text>
    <text x="1075" y="209" class="nodeText">• Admin revisa: duplicata, risco, campos ausentes</text>
    <text x="1075" y="240" class="nodeText">• Publicar, pausar, rejeitar ou expirar</text>
  </g>

  <!-- Feed Match -->
  <g filter="url(#softShadow)">
    <rect x="1270" y="180" width="440" height="270" rx="28" class="card2"/>
    <text x="1305" y="230" class="nodeTitle">Feed + Match</text>
    <text x="1305" y="267" class="nodeText">• Swipe vertical e card de vaga</text>
    <text x="1305" y="298" class="nodeText">• Ranking por match, confiança e frescor</text>
    <text x="1305" y="329" class="nodeText">• Score determinístico, não “achismo” da IA</text>
    <text x="1305" y="360" class="nodeText">• IA explica depois, usando evidências</text>
    <text x="1305" y="391" class="nodeText">• Filtros fixos continuam mandando</text>
  </g>

  <!-- Candidatura -->
  <g filter="url(#softShadow)">
    <rect x="1280" y="820" width="450" height="250" rx="28" class="card"/>
    <text x="1315" y="870" class="nodeTitle">Candidatura</text>
    <text x="1315" y="907" class="nodeText">• Plano de candidatura e readiness score</text>
    <text x="1315" y="938" class="nodeText">• Pitch para e-mail, LinkedIn ou WhatsApp</text>
    <text x="1315" y="969" class="nodeText">• Fit analysis e mock interview</text>
    <text x="1315" y="1000" class="nodeText">• Aplicação externa + tracker interno</text>
    <text x="1315" y="1031" class="nodeText">• Estado só muda com confirmação</text>
  </g>

  <!-- IA -->
  <g filter="url(#softShadow)">
    <rect x="1010" y="920" width="420" height="230" rx="28" class="card2"/>
    <text x="1045" y="970" class="nodeTitle">IA Confiável</text>
    <text x="1045" y="1007" class="nodeText">• IA estrutura e explica</text>
    <text x="1045" y="1038" class="nodeText">• Sistema valida e calcula</text>
    <text x="1045" y="1069" class="nodeText">• Evidence + confidence por campo</text>
    <text x="1045" y="1100" class="nodeText">• Evals antes de trocar prompt/modelo</text>
  </g>

  <!-- Agentes -->
  <g filter="url(#softShadow)">
    <rect x="425" y="920" width="450" height="230" rx="28" class="card"/>
    <text x="460" y="970" class="nodeTitle">Agentes + Tools</text>
    <text x="460" y="1007" class="nodeText">• Agente de candidatura</text>
    <text x="460" y="1038" class="nodeText">• Agente de CV</text>
    <text x="460" y="1069" class="nodeText">• Agente admin de vagas</text>
    <text x="460" y="1100" class="nodeText">• Tools com permissão e confirmação</text>
  </g>

  <!-- Operacao -->
  <g filter="url(#softShadow)">
    <rect x="80" y="820" width="455" height="250" rx="28" class="card2"/>
    <text x="115" y="870" class="nodeTitle">Operação</text>
    <text x="115" y="907" class="nodeText">• Logs, custo, latência e fallbacks</text>
    <text x="115" y="938" class="nodeText">• Termos, privacidade, consentimento e PII</text>
    <text x="115" y="969" class="nodeText">• Deep links, push, crash reporting</text>
    <text x="115" y="1000" class="nodeText">• Qualidade antes de escala</text>
  </g>

  <!-- cross connections -->
  <path class="lineMuted" marker-end="url(#arrowCyan)" d="M565 280C625 360 655 420 735 510"/>
  <path class="lineMuted" marker-end="url(#arrowPurple)" d="M1040 225C985 325 955 408 930 505"/>
  <path class="lineMuted" marker-end="url(#arrowCyan)" d="M1490 450C1492 555 1494 690 1495 820"/>
  <path class="lineMuted" marker-end="url(#arrowPurple)" d="M1280 965C1185 950 1092 886 1010 807C968 767 940 730 920 695"/>
  <path class="lineMuted" marker-end="url(#arrowCyan)" d="M875 1010C935 985 970 965 1010 945"/>
  <path class="lineMuted" marker-end="url(#arrowPurple)" d="M535 940C420 890 350 835 300 755C265 700 270 633 720 610"/>

  <!-- implementation pipeline -->
  <g filter="url(#softShadow)">
    <rect x="355" y="424" width="1090" height="104" rx="28" fill="#0B0714" stroke="#2B2440" stroke-width="2"/>
    <text x="390" y="466" class="tiny">ORDEM DAS DEPENDÊNCIAS</text>
    <text x="390" y="502" class="flow">Schemas → Normalização → Evidence → Reliability → Match → IA Explicável → Evals → Embeddings → RAG → Agentes</text>
  </g>

  <!-- status legend -->
  <g>
    <rect x="92" y="1120" width="445" height="44" rx="14" fill="#0B0714" stroke="#2B2440"/>
    <circle cx="124" cy="1142" r="7" fill="#20E7F6"/>
    <text x="142" y="1148" class="tiny">Implementado</text>
    <circle cx="276" cy="1142" r="7" fill="#7C5CFF"/>
    <text x="294" y="1148" class="tiny">Parcial</text>
    <circle cx="402" cy="1142" r="7" fill="#8F86AA"/>
    <text x="420" y="1148" class="tiny">Planejado</text>
  </g>
</svg>
